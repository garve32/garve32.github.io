<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보드게임 점수 계산기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <section class="panel game-tabs">
        <button id="tabRenaissance" type="button" class="tab-btn">
          르네상스의 거장들
        </button>
        <button id="tabHarmonies" type="button" class="tab-btn">
          하모니즈
        </button>
        <button id="tabCentury" type="button" class="tab-btn">
          센추리:골렘
        </button>
        <button id="tabCastle" type="button" class="tab-btn active">
          캐슬콤보
        </button>
        <button id="tabLostCity" type="button" class="tab-btn">
          로스트시티
        </button>
        <button id="tabParks" type="button" class="tab-btn">
          파크스
        </button>
        <button id="tabRestore" type="button" class="tab-btn">
          리스토어
        </button>
      </section>

      <section id="pageCastle" class="game-page active">
        <section class="panel controls">
          <div class="field">
            <select id="playerCount">
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
            </select>
          </div>
          <div class="field">
            <select id="roundCount">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="resetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="roundContainer"></section>
        <div class="round-add-wrap">
          <button id="addRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>

      <section id="pageLostCity" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="lostPlayerCount">
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
            </select>
          </div>
          <div class="field">
            <select id="lostRoundCount">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="lostResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="lostRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="lostAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>

      <section id="pageHarmonies" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="harmPlayerCount">
              <option value="1">1인</option>
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
            </select>
          </div>
          <div class="field">
            <select id="harmRoundCount">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="harmResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="harmRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="harmAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>

      <section id="pageCentury" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="centPlayerCount">
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
            </select>
          </div>
          <div class="field">
            <select id="centRoundCount">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="centResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="centRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="centAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>

      <section id="pageRenaissance" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="renaPlayerCount" aria-label="플레이어 수">
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
            </select>
          </div>
          <div class="field">
            <select id="renaRoundCount" aria-label="게임 기록 수">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="renaResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="renaRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="renaAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>

      <section id="pageParks" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="parksPlayerCount" aria-label="플레이어 수">
              <option value="1">1인</option>
              <option value="2" selected>2인</option>
              <option value="3">3인</option>
              <option value="4">4인</option>
              <option value="5">5인</option>
            </select>
          </div>
          <div class="field">
            <select id="parksRoundCount" aria-label="게임 기록 수">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="parksResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>

        <section id="parksRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="parksAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>
      <section id="pageRestore" class="game-page">
        <section class="panel controls">
          <div class="field">
            <select id="restorePlayerCount" aria-label="플레이어 수" disabled>
              <option value="2" selected>2인 전용</option>
            </select>
          </div>
          <div class="field">
            <select id="restoreRoundCount" aria-label="게임 기록 수">
              <option value="1" selected>1게임</option>
              <option value="2">2게임</option>
              <option value="3">3게임</option>
            </select>
          </div>
          <div class="field">
            <button id="restoreResetBtn" type="button" class="btn-danger">
              전체 점수 초기화
            </button>
          </div>
        </section>
        <section id="restoreRoundContainer"></section>
        <div class="round-add-wrap">
          <button id="restoreAddRoundBtn" type="button" class="round-add-btn">
            게임 추가 +
          </button>
        </div>
      </section>
    </div>

    <script>
      const state = {
        players: 2,
        rounds: 1,
        lostPlayers: 2,
        lostRounds: 1,
        harmPlayers: 2,
        harmRounds: 1,
        centPlayers: 2,
        centRounds: 1,
        renaPlayers: 2,
        renaRounds: 1,
        parksPlayers: 2,
        parksRounds: 1,
        restorePlayers: 2,
        restoreRounds: 1,
      };

      const STORAGE_KEYS = {
        castle: "board-score-castle-v1",
        lost: "board-score-lost-v1",
        harmonies: "board-score-harmonies-v1",
        century: "board-score-century-v1",
        renaissance: "board-score-renaissance-v1",
        parks: "board-score-parks-v1",
        restore: "board-score-restore-v1",
        ui: "board-score-ui-v1",
      };

      const playerCountEl = document.getElementById("playerCount");
      const roundCountEl = document.getElementById("roundCount");
      const resetBtn = document.getElementById("resetBtn");
      const addRoundBtnEl = document.getElementById("addRoundBtn");
      const roundContainerEl = document.getElementById("roundContainer");
      const tabCastleEl = document.getElementById("tabCastle");
      const tabLostCityEl = document.getElementById("tabLostCity");
      const tabHarmoniesEl = document.getElementById("tabHarmonies");
      const tabCenturyEl = document.getElementById("tabCentury");
      const tabRenaissanceEl = document.getElementById("tabRenaissance");
      const tabParksEl = document.getElementById("tabParks");
      const pageCastleEl = document.getElementById("pageCastle");
      const pageLostCityEl = document.getElementById("pageLostCity");
      const pageHarmoniesEl = document.getElementById("pageHarmonies");
      const pageCenturyEl = document.getElementById("pageCentury");
      const pageRenaissanceEl = document.getElementById("pageRenaissance");
      const pageParksEl = document.getElementById("pageParks");
      const lostPlayerCountEl = document.getElementById("lostPlayerCount");
      const lostRoundCountEl = document.getElementById("lostRoundCount");
      const lostResetBtnEl = document.getElementById("lostResetBtn");
      const lostAddRoundBtnEl = document.getElementById("lostAddRoundBtn");
      const lostRoundContainerEl =
        document.getElementById("lostRoundContainer");
      const harmPlayerCountEl = document.getElementById("harmPlayerCount");
      const harmRoundCountEl = document.getElementById("harmRoundCount");
      const harmResetBtnEl = document.getElementById("harmResetBtn");
      const harmAddRoundBtnEl = document.getElementById("harmAddRoundBtn");
      const harmRoundContainerEl =
        document.getElementById("harmRoundContainer");
      const centPlayerCountEl = document.getElementById("centPlayerCount");
      const centRoundCountEl = document.getElementById("centRoundCount");
      const centResetBtnEl = document.getElementById("centResetBtn");
      const centAddRoundBtnEl = document.getElementById("centAddRoundBtn");
      const centRoundContainerEl =
        document.getElementById("centRoundContainer");
      const renaPlayerCountEl = document.getElementById("renaPlayerCount");
      const renaRoundCountEl = document.getElementById("renaRoundCount");
      const renaResetBtnEl = document.getElementById("renaResetBtn");
      const renaAddRoundBtnEl = document.getElementById("renaAddRoundBtn");
      const renaRoundContainerEl =
        document.getElementById("renaRoundContainer");
      const parksPlayerCountEl = document.getElementById("parksPlayerCount");
      const parksRoundCountEl = document.getElementById("parksRoundCount");
      const parksResetBtnEl = document.getElementById("parksResetBtn");
      const parksAddRoundBtnEl = document.getElementById("parksAddRoundBtn");
      const parksRoundContainerEl =
        document.getElementById("parksRoundContainer");

      const GAME_DEFS = {
        restore: {
          fixedPlayers: 2,
          statePlayersKey: "restorePlayers",
          stateRoundsKey: "restoreRounds",
          storageKey: STORAGE_KEYS.restore,
          pageEl: document.getElementById("pageRestore"),
          playerCountEl: document.getElementById("restorePlayerCount"),
          roundCountEl: document.getElementById("restoreRoundCount"),
          addRoundBtnEl: document.getElementById("restoreAddRoundBtn"),
          roundContainerEl: document.getElementById("restoreRoundContainer"),
          valueSelector: 'input[type="number"]',
        },
        castle: {
          statePlayersKey: "players",
          stateRoundsKey: "rounds",
          storageKey: STORAGE_KEYS.castle,
          pageEl: pageCastleEl,
          playerCountEl,
          roundCountEl,
          addRoundBtnEl,
          roundContainerEl,
          valueSelector: 'input[type="number"]',
        },
        lostcity: {
          statePlayersKey: "lostPlayers",
          stateRoundsKey: "lostRounds",
          storageKey: STORAGE_KEYS.lost,
          pageEl: pageLostCityEl,
          playerCountEl: lostPlayerCountEl,
          roundCountEl: lostRoundCountEl,
          addRoundBtnEl: lostAddRoundBtnEl,
          roundContainerEl: lostRoundContainerEl,
          valueSelector:
            'input[type="number"], input[type="hidden"], input[type="checkbox"]',
        },
        harmonies: {
          statePlayersKey: "harmPlayers",
          stateRoundsKey: "harmRounds",
          storageKey: STORAGE_KEYS.harmonies,
          pageEl: pageHarmoniesEl,
          playerCountEl: harmPlayerCountEl,
          roundCountEl: harmRoundCountEl,
          addRoundBtnEl: harmAddRoundBtnEl,
          roundContainerEl: harmRoundContainerEl,
          valueSelector: 'input[type="number"]',
        },
        century: {
          statePlayersKey: "centPlayers",
          stateRoundsKey: "centRounds",
          storageKey: STORAGE_KEYS.century,
          pageEl: pageCenturyEl,
          playerCountEl: centPlayerCountEl,
          roundCountEl: centRoundCountEl,
          addRoundBtnEl: centAddRoundBtnEl,
          roundContainerEl: centRoundContainerEl,
          valueSelector: 'input[type="number"]',
        },
        renaissance: {
          statePlayersKey: "renaPlayers",
          stateRoundsKey: "renaRounds",
          storageKey: STORAGE_KEYS.renaissance,
          pageEl: pageRenaissanceEl,
          playerCountEl: renaPlayerCountEl,
          roundCountEl: renaRoundCountEl,
          addRoundBtnEl: renaAddRoundBtnEl,
          roundContainerEl: renaRoundContainerEl,
          valueSelector: 'input[type="number"], input[type="checkbox"]',
        },
        parks: {
          statePlayersKey: "parksPlayers",
          stateRoundsKey: "parksRounds",
          storageKey: STORAGE_KEYS.parks,
          pageEl: pageParksEl,
          playerCountEl: parksPlayerCountEl,
          roundCountEl: parksRoundCountEl,
          addRoundBtnEl: parksAddRoundBtnEl,
          roundContainerEl: parksRoundContainerEl,
          valueSelector: 'input[type="number"], input[type="checkbox"]',
        },
      };

      function loadStorageByKey(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (_) {
          return null;
        }
      }

      function saveStorageByKey(key, payload) {
        try {
          localStorage.setItem(key, JSON.stringify(payload));
        } catch (_) {
          // Ignore storage failures on restricted environments.
        }
      }

      function collectValues(rootEl, selector) {
        const values = {};
        rootEl.querySelectorAll(selector).forEach((el) => {
          if (!el.id) return;
          if (el.type === "checkbox") {
            values[el.id] = Boolean(el.checked);
          } else {
            values[el.id] = el.value;
          }
        });
        return values;
      }

      function applyValues(values) {
        if (!values) return;
        Object.entries(values).forEach(([id, value]) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (el.type === "checkbox") {
            el.checked = Boolean(value);
          } else {
            el.value = String(value);
          }
        });
      }

      function persistGame(gameKey) {
        const game = GAME_DEFS[gameKey];
        if (!game) return;
        saveStorageByKey(game.storageKey, {
          settings: {
            players: state[game.statePlayersKey],
            rounds: state[game.stateRoundsKey],
          },
          values: collectValues(game.roundContainerEl, game.valueSelector),
        });
      }

      const storedByGame = {};
      Object.keys(GAME_DEFS).forEach((gameKey) => {
        const game = GAME_DEFS[gameKey];
        storedByGame[gameKey] = loadStorageByKey(game.storageKey);
      });
      const storedUI = loadStorageByKey(STORAGE_KEYS.ui);

      Object.entries(GAME_DEFS).forEach(([gameKey, game]) => {
        const stored = storedByGame[gameKey];
        if (stored?.settings) {
          state[game.statePlayersKey] =
            game.fixedPlayers || Number(stored.settings.players) || 2;
          state[game.stateRoundsKey] = Math.min(
            3,
            Math.max(1, Number(stored.settings.rounds) || 1),
          );
        }
        game.playerCountEl.value = String(state[game.statePlayersKey]);
        game.roundCountEl.value = String(state[game.stateRoundsKey]);
      });

      function updateRoundAddButton(gameKey) {
        const game = GAME_DEFS[gameKey];
        if (!game?.addRoundBtnEl) return;
        const rounds = Math.min(3, Math.max(1, Number(state[game.stateRoundsKey]) || 1));
        game.addRoundBtnEl.disabled = rounds >= 3;
      }

      function setGameRounds(gameKey, nextRounds) {
        const game = GAME_DEFS[gameKey];
        const rounds = Math.min(3, Math.max(1, Number(nextRounds) || 1));
        state[game.stateRoundsKey] = rounds;
        game.roundCountEl.value = String(rounds);
        buildGameUI(gameKey);
        updateRoundAddButton(gameKey);
      }

      function toScore(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return 0;
        return Math.floor(n);
      }

      function normalizeInputNumber(
        inputEl,
        { min = -Infinity, max = Infinity } = {},
      ) {
        const value = Math.min(max, Math.max(min, toScore(inputEl.value)));
        inputEl.value = String(value);
        return value;
      }

      function getNormalizedValueById(id, options) {
        return normalizeInputNumber(document.getElementById(id), options);
      }

      function sumNormalizedRange(start, end, idBuilder, options) {
        let total = 0;
        for (let i = start; i <= end; i++) {
          total += getNormalizedValueById(idBuilder(i), options);
        }
        return total;
      }

      function setTextById(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      function createNumberInput({
        id,
        min,
        max,
        onInput,
        className,
        placeholder,
      }) {
        const input = document.createElement("input");
        input.type = "number";
        input.id = id;
        input.step = "1";
        if (min !== undefined) input.min = String(min);
        if (max !== undefined) input.max = String(max);
        if (className) input.className = className;
        if (placeholder) input.placeholder = placeholder;
        input.value = "0";
        input.setAttribute("inputmode", "numeric");
        input.setAttribute("pattern", "[0-9]*");
        bindSelectAll(input);
        if (onInput) input.addEventListener("input", onInput);
        return input;
      }

      function makeGridInput(round, player, cell) {
        return createNumberInput({
          id: `cell-r${round}-p${player}-c${cell}`,
          onInput: recalculate,
        });
      }

      function makeKeyInput(round, player) {
        return createNumberInput({
          id: `key-r${round}-p${player}`,
          min: 0,
          onInput: recalculate,
        });
      }

      const LOST_EXPEDITIONS = [
        { key: "z1", label: "1구역", cls: "zone-1" },
        { key: "z2", label: "2구역", cls: "zone-2" },
        { key: "z3", label: "3구역", cls: "zone-3" },
        { key: "z4", label: "4구역", cls: "zone-4" },
        { key: "z5", label: "5구역", cls: "zone-5" },
      ];

      function makeLostInput(id, min, max) {
        return createNumberInput({
          id,
          min,
          max,
          onInput: recalculateLost,
        });
      }

      function makeLostWagerButtons(id) {
        const wrap = document.createElement("div");
        wrap.className = "lost-wager-group";

        [0, 1, 2, 3].forEach((n) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `lost-wager-btn${n === 0 ? " active" : ""}`;
          btn.dataset.value = String(n);
          btn.textContent = String(n);
          btn.addEventListener("click", () => {
            setLostWagerValue(id, n);
          });
          wrap.appendChild(btn);
        });

        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.id = id;
        hidden.value = "0";
        wrap.appendChild(hidden);

        return wrap;
      }

      function syncLostWagerButtons(id) {
        const hidden = document.getElementById(id);
        if (!hidden) return;
        const value = normalizeInputNumber(hidden, { min: 0, max: 3 });
        const wrap = hidden.parentElement;
        if (!wrap) return;
        const buttons = wrap.querySelectorAll(".lost-wager-btn");
        buttons.forEach((btn) => {
          btn.classList.toggle("active", toScore(btn.dataset.value) === value);
        });
      }

      function setLostWagerValue(id, value) {
        const hidden = document.getElementById(id);
        if (!hidden) return;
        hidden.value = String(value);
        syncLostWagerButtons(id);
        recalculateLost();
      }

      function makeLostBonusToggle(id) {
        const wrap = document.createElement("label");
        wrap.className = "lost-toggle";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = id;
        checkbox.addEventListener("change", recalculateLost);

        wrap.appendChild(checkbox);
        return wrap;
      }

      function bindSelectAll(input) {
        const selectAll = () => {
          if (typeof input.select === "function") {
            input.select();
          }
        };

        input.addEventListener("focus", () => {
          requestAnimationFrame(selectAll);
        });

        input.addEventListener("mouseup", (event) => {
          event.preventDefault();
          selectAll();
        });
      }

      function createRoundShell(round, metaId, playerCount) {
        const roundPanel = document.createElement("section");
        roundPanel.className = "panel round-block";

        const roundHead = document.createElement("div");
        roundHead.className = "round-head";

        const title = document.createElement("h2");
        title.className = "round-title";
        title.textContent = `${round}게임`;
        roundHead.appendChild(title);

        const roundMeta = document.createElement("div");
        roundMeta.className = "round-meta";
        roundMeta.id = metaId;
        roundHead.appendChild(roundMeta);
        roundPanel.appendChild(roundHead);

        const playerGrid = document.createElement("div");
        playerGrid.className = "player-grid";
        playerGrid.dataset.playerCount = String(playerCount);

        return { roundPanel, playerGrid };
      }

      function createPlayerCardShell(player) {
        const card = document.createElement("article");
        card.className = "player-card";

        const header = document.createElement("div");
        header.className = "player-header";

        const name = document.createElement("div");
        name.className = `player-name player-theme-${player}`;
        name.textContent = `${player}P`;

        const headRight = document.createElement("div");
        headRight.className = "player-head-right";

        header.appendChild(name);
        header.appendChild(headRight);
        card.appendChild(header);

        return { card, headRight };
      }

      function syncAllLostWagerButtons() {
        document
          .querySelectorAll('#pageLostCity input[type="hidden"][id^="lost-w-"]')
          .forEach((hidden) => {
            syncLostWagerButtons(hidden.id);
          });
      }

      function buildUI() {
        const prevValues = collectValues(
          roundContainerEl,
          'input[type="number"]',
        );
        roundContainerEl.innerHTML = "";

        for (let r = 1; r <= state.rounds; r++) {
          const { roundPanel, playerGrid } = createRoundShell(
            r,
            `round-meta-r${r}`,
            state.players,
          );

          for (let p = 1; p <= state.players; p++) {
            const { card, headRight } = createPlayerCardShell(p);

            const keyLabel = document.createElement("span");
            keyLabel.className = "inline-bonus-icon";
            keyLabel.textContent = "KEY";
            const keyInput = makeKeyInput(r, p);
            keyInput.classList.add("inline-bonus-input");

            const roundTotal = document.createElement("div");
            roundTotal.className = `round-total-chip player-theme-${p}`;
            roundTotal.id = `round-total-r${r}-p${p}`;
            roundTotal.textContent = "합계 0점";

            headRight.appendChild(keyLabel);
            headRight.appendChild(keyInput);
            headRight.appendChild(roundTotal);

            const scoreGrid = document.createElement("div");
            scoreGrid.className = "score-grid";

      function computeCastleRoundScore(r, p) {
        const roundCard = sumNormalizedRange(
          1,
          9,
          (c) => `cell-r${r}-p${p}-c${c}`,
        );
        const roundKey = getNormalizedValueById(`key-r${r}-p${p}`, { min: 0 });
        const roundFinal = roundCard + roundKey;
        setTextById(`round-total-r${r}-p${p}`, `합계 ${roundFinal}점`);
        return roundFinal;
      }

      function computeHarmoniesRoundScore(r, p) {
        const landscapeTotal = sumNormalizedRange(
          0,
          HARM_LANDSCAPES.length - 1,
          (idx) => `harm-land-r${r}-p${p}-c${idx}`,
          { min: 0 },
        );
        const animalTotal = sumNormalizedRange(
          1,
          HARM_ANIMAL_INPUTS,
          (a) => `harm-animal-r${r}-p${p}-a${a}`,
          { min: 0 },
        );
        const total = landscapeTotal + animalTotal;
        setTextById(`harm-land-sub-r${r}-p${p}`, `풍경 ${landscapeTotal}`);
        setTextById(`harm-animal-sub-r${r}-p${p}`, `동물 ${animalTotal}`);
        setTextById(`harm-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

      function computeCenturyRoundScore(r, p) {
        const cardTotal = sumNormalizedRange(
          1,
          6,
          (i) => `cent-card-r${r}-p${p}-i${i}`,
          { min: 0 },
        );
        const gold = getNormalizedValueById(`cent-gold-r${r}-p${p}`, {
          min: 0,
        });
        const silver = getNormalizedValueById(`cent-silver-r${r}-p${p}`, {
          min: 0,
        });
        const gem = getNormalizedValueById(`cent-gem-r${r}-p${p}`, { min: 0 });
        const bonusTotal = gold * 3 + silver + gem;
        const total = cardTotal + bonusTotal;
        setTextById(`cent-card-sub-r${r}-p${p}`, `카드 ${cardTotal}`);
        setTextById(`cent-bonus-sub-r${r}-p${p}`, `보너스 ${bonusTotal}`);
        setTextById(`cent-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

      function computeLostRoundScore(r, p) {
        let total = 0;
        const bonus = getNormalizedValueById(`lost-bonus-r${r}-p${p}`, {
          min: 0,
        });

        LOST_EXPEDITIONS.forEach((_, idx) => {
          const sumId = `lost-sum-r${r}-p${p}-e${idx}`;
          const wagerId = `lost-w-r${r}-p${p}-e${idx}`;
          const bonusEl = document.getElementById(`lost-b-r${r}-p${p}-e${idx}`);
          const expScoreEl = document.getElementById(
            `lost-exp-score-r${r}-p${p}-e${idx}`,
          );

          const sum = getNormalizedValueById(sumId, { min: 0 });
          const wager = getNormalizedValueById(wagerId, { min: 0, max: 3 });
          const hasBonus = Boolean(bonusEl.checked);

          let expeditionScore = 0;
          if (sum > 0 || wager > 0 || hasBonus) {
            expeditionScore = (sum - 20) * (wager + 1);
            if (hasBonus) {
              expeditionScore += 20;
            }
          }

          expScoreEl.textContent = String(expeditionScore);
          total += expeditionScore;
        });

        total += bonus;
        setTextById(`lost-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

      function getRenaissanceFaithScore(position) {
        const spaces = [
          [24, 20],
          [21, 16],
          [18, 12],
          [15, 9],
          [12, 6],
          [9, 4],
          [6, 2],
          [3, 1],
        ];
        const match = spaces.find(([space]) => position >= space);
        return match ? match[1] : 0;
      }

      function getRenaissanceResourceCount(r, p) {
        return getNormalizedValueById(
          `rena-resource-r${r}-p${p}`,
          { min: 0 },
        );
      }

      function computeRenaissanceRoundScore(r, p) {
        const development = sumNormalizedRange(
          1,
          3,
          (i) => `rena-dev-col-r${r}-p${p}-i${i}`,
          { min: 0 },
        );
        const faithPosition = getNormalizedValueById(
          `rena-faith-r${r}-p${p}`,
          { min: 0, max: 24 },
        );
        const faith = getRenaissanceFaithScore(faithPosition);
        let pope = 0;
        [2, 3, 4].forEach((value) => {
          if (document.getElementById(`rena-pope-${value}-r${r}-p${p}`).checked) {
            pope += value;
          }
        });
        const leaders = getNormalizedValueById(
          `rena-leader-r${r}-p${p}`,
          { min: 0 },
        );
        const resources = getRenaissanceResourceCount(r, p);
        const resourceScore = Math.floor(resources / 5);
        const total = development + faith + pope + leaders + resourceScore;

        setTextById(`rena-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

      function getParksPhotoBonus(r, p) {
        if (state.parksPlayers <= 1) return 0;
        const photoCounts = [];
        for (let player = 1; player <= state.parksPlayers; player++) {
          photoCounts.push(
            getNormalizedValueById(`parks-photos-r${r}-p${player}`, { min: 0 }),
          );
        }
        const rankedCounts = [...new Set(photoCounts)].sort((a, b) => b - a);
        const photos = photoCounts[p - 1];
        if (photos <= 0) return 0;
        if (photos === rankedCounts[0]) {
          return state.parksPlayers === 2 ? 3 : 4;
        }
        if (state.parksPlayers >= 3 && photos === rankedCounts[1]) return 2;
        return 0;
      }

      function getParksVisitedCount(r, p) {
        let count = 0;
        for (let park = 1; park <= 10; park++) {
          if (
            getNormalizedValueById(`parks-points-r${r}-p${p}-i${park}`, {
              min: 0,
            }) > 0
          ) {
            count += 1;
          }
        }
        return count;
      }

      function computeParksRoundScore(r, p) {
        const parkPoints = sumNormalizedRange(
          1,
          10,
          (park) => `parks-points-r${r}-p${p}-i${park}`,

        );
        const visitedParks = getParksVisitedCount(r, p);
        const photos = getNormalizedValueById(`parks-photos-r${r}-p${p}`, {
          min: 0,
        });
        const photoBonus = getParksPhotoBonus(r, p);
        const passion = getNormalizedValueById(`parks-passion-r${r}-p${p}`, {
          min: 0,

        const fallBonus = document.getElementById(

          : 0;
        const firstHiker = document.getElementById(
          `parks-first-r${r}-p${p}`,

          : 0;
        const total =

        setTextById(

        setTextById(`parks-photo-bonus-r${r}-p${p}`, `보너스 +${photoBonus}`);
        setTextById(`parks-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

        const def = GAME_RECALC_DEFS[gameKey];
        const roundScores = collectRoundScores(
          def.getRoundCount(),
          def.getPlayerCount(),
          def.computeScore,
          def.tieBreakByPlayer,
        );
        finalizeRecalculation(roundScores, def.metaPrefix, gameKey);

      function renderRoundResults(roundScores, metaPrefix) {
        roundScores.forEach(({ round, entries }) => {
          const metaEl = document.getElementById(`${metaPrefix}${round}`);
          metaEl.innerHTML = "";

          const maxScore = Math.max(...entries.map((entry) => entry.score));
          const scoreLeaders = entries.filter(
            (entry) => entry.score === maxScore,
          );
          const usesTieBreak = scoreLeaders.some((entry) =>
            Number.isFinite(entry.tieBreak),
          );
          const maxTieBreak = usesTieBreak
            ? Math.max(...scoreLeaders.map((entry) => entry.tieBreak))
            : null;

          entries.forEach((entry) => {
            const chip = document.createElement("span");
            const isWin =
              entry.score === maxScore &&
              (!usesTieBreak || entry.tieBreak === maxTieBreak);
            chip.className = `round-result-chip player-theme-${entry.player} ${isWin ? "win" : "lose"}`;

            const scoreText = document.createElement("span");
            scoreText.textContent = `${entry.player}P ${entry.score}점`;

            const crown = document.createElement("span");
            crown.className = `crown-slot${isWin ? "" : " hidden"}`;
            crown.textContent = "1위";

            chip.appendChild(scoreText);
            chip.appendChild(crown);
            metaEl.appendChild(chip);
          });
        });
      }

      function collectRoundScores(
        roundCount,
        playerCount,
        scoreByPlayer,
        tieBreakByPlayer,
      ) {
        const roundScores = [];
        for (let r = 1; r <= roundCount; r++) {
          const entries = [];
          for (let p = 1; p <= playerCount; p++) {
            entries.push({
              player: p,
              score: scoreByPlayer(r, p),
              tieBreak: tieBreakByPlayer
                ? tieBreakByPlayer(r, p)
                : undefined,
            });
          }
          roundScores.push({ round: r, entries });
        }
        return roundScores;
      }

      function finalizeRecalculation(roundScores, metaPrefix, gameKey) {
        renderRoundResults(roundScores, metaPrefix);
        persistGame(gameKey);
      }

        label.className = "parks-toggle";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = id;
        input.addEventListener("change", () => {
          if (input.checked && id.startsWith("parks-first-")) {
            const round = id.match(/-r(\d+)-/)?.[1];
            parksRoundContainerEl
              .querySelectorAll(`input[id^="parks-first-r${round}-"]`)
              .forEach((other) => {
                if (other !== input) other.checked = false;
              });
          }
          recalculateParks();
        });
        label.appendChild(input);
        label.append(labelText);
        return label;
      }

      function buildParksUI() {
        const prevValues = collectValues(
          parksRoundContainerEl,
          'input[type="number"], input[type="checkbox"]',
        );
        parksRoundContainerEl.innerHTML = "";

        for (let r = 1; r <= state.parksRounds; r++) {
          const { roundPanel, playerGrid } = createRoundShell(
            r,
            `parks-round-meta-r${r}`,
            state.parksPlayers,
          );
          roundPanel.querySelector(".round-title").textContent = `${r}게임`;

          for (let p = 1; p <= state.parksPlayers; p++) {
            const { card, headRight } = createPlayerCardShell(p);
            const total = document.createElement("div");
            total.className = `round-total-chip player-theme-${p}`;
            total.id = `parks-total-r${r}-p${p}`;
            total.textContent = "합계 0점";
            headRight.appendChild(total);

            const grid = document.createElement("div");
            grid.className = "parks-grid";
            const parkField = document.createElement("div");
            parkField.className = "parks-field wide";
            const parkLabel = document.createElement("label");
            parkLabel.id = `parks-parks-label-r${r}-p${p}`;
            parkLabel.textContent = "방문한 공원 점수 (최대 10개)";
            const parkGrid = document.createElement("div");
            parkGrid.className = "parks-park-grid";
            for (let park = 1; park <= 10; park++) {
              const parkCell = document.createElement("div");
              parkCell.className = "parks-park-cell";
              const parkName = document.createElement("span");
              parkName.textContent = `${park}`;
              const parkInput = createNumberInput({
                id: `parks-points-r${r}-p${p}-i${park}`,
                min: 0,
                onInput: recalculateParks,
              });
              parkInput.setAttribute("aria-label", `${park}번째 방문 공원 점수`);
              parkCell.appendChild(parkName);
              parkCell.appendChild(parkInput);
              parkGrid.appendChild(parkCell);
            }
            parkField.appendChild(parkLabel);
            parkField.appendChild(parkGrid);
            grid.appendChild(parkField);

            const photoInput = createNumberInput({
              id: `parks-photos-r${r}-p${p}`,
              min: 0,
              onInput: recalculateParks,
            });
            const photoField = document.createElement("div");
            photoField.className = "parks-field parks-photo-field";
            const photoLabel = document.createElement("label");
            photoLabel.htmlFor = photoInput.id;
            photoLabel.textContent = "사진 수 (각 1점)";
            const photoWrap = document.createElement("div");
            photoWrap.className = "parks-photo-wrap";
            const photoBonus = document.createElement("span");
            photoBonus.className = "parks-photo-bonus";
            photoBonus.id = `parks-photo-bonus-r${r}-p${p}`;
            photoBonus.textContent = "보너스 +0";
            photoWrap.appendChild(photoInput);
            photoWrap.appendChild(photoBonus);
            photoField.appendChild(photoLabel);
            photoField.appendChild(photoWrap);
            grid.appendChild(photoField);

            grid.appendChild(
              createParksField(
                "버킷리스트",
                createNumberInput({
                  id: `parks-passion-r${r}-p${p}`,
                  min: 0,
                  onInput: recalculateParks,
                }),
              ),
            );
            grid.appendChild(
              createParksToggle(`parks-fall-r${r}-p${p}`, "가을 +3"),
            );
            grid.appendChild(
              createParksToggle(`parks-first-r${r}-p${p}`, "선두 +1"),
            );

            card.appendChild(grid);
            playerGrid.appendChild(card);
          }

          roundPanel.appendChild(playerGrid);
          parksRoundContainerEl.appendChild(roundPanel);
        }

        applyValues(prevValues);
        recalculateGame("parks");
      }

      function recalculateParks() {
        recalculateByGameDef("parks");
      }

      function buildLostUI() {
        const prevValues = collectValues(
          lostRoundContainerEl,
          'input[type="number"], input[type="hidden"], input[type="checkbox"]',
        );
        lostRoundContainerEl.innerHTML = "";

        for (let r = 1; r <= state.lostRounds; r++) {
          const { roundPanel, playerGrid } = createRoundShell(
            r,
            `lost-round-meta-r${r}`,
            state.lostPlayers,
          );

          for (let p = 1; p <= state.lostPlayers; p++) {
            const { card, headRight } = createPlayerCardShell(p);

            const bonusLabel = document.createElement("span");
            bonusLabel.className = "inline-bonus-icon";
            bonusLabel.textContent = "추가";
            const bonusInput = makeLostInput(
              `lost-bonus-r${r}-p${p}`,
              0,
              undefined,
            );
            bonusInput.classList.add("inline-bonus-input");

            const roundTotal = document.createElement("div");
            roundTotal.className = `round-total-chip player-theme-${p}`;
            roundTotal.id = `lost-total-r${r}-p${p}`;
            roundTotal.textContent = "합계 0점";

            headRight.appendChild(bonusLabel);
            headRight.appendChild(bonusInput);
            headRight.appendChild(roundTotal);

            const grid = document.createElement("div");
            grid.className = "lost-grid";

            const guideRow = document.createElement("div");
            guideRow.className = "lost-guide-row";

            const g0 = document.createElement("div");
            g0.className = "lost-guide";
            g0.textContent = "";
            const g1 = document.createElement("div");
            g1.className = "lost-guide";
            g1.textContent = "점수합";
            const g2 = document.createElement("div");
            g2.className = "lost-guide";
            g2.textContent = "x2투자";
            const g3 = document.createElement("div");
            g3.className = "lost-guide";
            g3.textContent = "8장+";
            const g4 = document.createElement("div");
            g4.className = "lost-guide";
            g4.textContent = "구역합";

            guideRow.appendChild(g0);
            guideRow.appendChild(g1);
            guideRow.appendChild(g2);
            guideRow.appendChild(g3);
            guideRow.appendChild(g4);
            grid.appendChild(guideRow);

            LOST_EXPEDITIONS.forEach((exp, idx) => {
              const row = document.createElement("div");
              row.className = `lost-row ${exp.cls}`;

              const label = document.createElement("div");
              label.className = `lost-label ${exp.cls}`;
              label.textContent = exp.label;

              const sumInput = makeLostInput(
                `lost-sum-r${r}-p${p}-e${idx}`,
                0,
                undefined,
              );
              sumInput.classList.add("lost-sum-input");
              sumInput.placeholder = "숫자합";

              const wagerInput = makeLostWagerButtons(
                `lost-w-r${r}-p${p}-e${idx}`,
              );
              const bonusToggle = makeLostBonusToggle(
                `lost-b-r${r}-p${p}-e${idx}`,
              );

              const expScore = document.createElement("div");
              expScore.className = "lost-exp-score";
              expScore.id = `lost-exp-score-r${r}-p${p}-e${idx}`;
              expScore.textContent = "0";

              row.appendChild(label);
              row.appendChild(sumInput);
              row.appendChild(wagerInput);
              row.appendChild(bonusToggle);
              row.appendChild(expScore);
              grid.appendChild(row);
            });

            card.appendChild(grid);
            playerGrid.appendChild(card);
          }

          roundPanel.appendChild(playerGrid);
          lostRoundContainerEl.appendChild(roundPanel);
        }

        applyValues(prevValues);
        syncAllLostWagerButtons();
        recalculateGame("lostcity");
      }

      function recalculateLost() {
        recalculateByGameDef("lostcity");
      }

      const RESTORE_PARTS = [1, 2, 3, 4, 5];
      const RESTORE_CATEGORIES = [
        { key: "animal", label: "동물 그룹" },
        { key: "forest", label: "숲" },
        { key: "lake", label: "호수" },
        { key: "purifier", label: "정화기" },
        { key: "mission", label: "미션" },
        { key: "tile", label: "타일" },
      ];

      function computeRestoreRoundScore(r, p) {
        let total = 0;
        RESTORE_CATEGORIES.forEach(({ key }) => {
          const subtotal = sumNormalizedRange(
            1,
            RESTORE_PARTS.length,
            (part) => `restore-${key}-r${r}-p${p}-i${part}`,
          );
          setTextById(`restore-${key}-subtotal-r${r}-p${p}`, `${subtotal}점`);
          total += subtotal;
        });
        setTextById(`restore-total-r${r}-p${p}`, `합계 ${total}점`);
        return total;
      }

      function recalculateRestore() {
        recalculateByGameDef("restore");
      }

      function buildRestoreUI() {
        const container = GAME_DEFS.restore.roundContainerEl;
        const prevValues = collectValues(container, 'input[type="number"]');
        container.innerHTML = "";

        for (let r = 1; r <= state.restoreRounds; r++) {
          const { roundPanel, playerGrid } = createRoundShell(
            r,
            `restore-round-meta-r${r}`,
            2,
          );
          for (let p = 1; p <= 2; p++) {
            const { card, headRight } = createPlayerCardShell(p);
            const total = document.createElement("div");
            total.className = `round-total-chip player-theme-${p}`;
            total.id = `restore-total-r${r}-p${p}`;
            total.textContent = "합계 0점";
            headRight.appendChild(total);

            const grid = document.createElement("div");
            grid.className = "restore-grid";
            const guide = document.createElement("div");
            guide.className = "restore-row restore-guide";
            ["점수 항목", ...RESTORE_PARTS.map((part) => `부분 ${part}`), "소계"].forEach((text) => {
              const heading = document.createElement("span");
              heading.textContent = text;
              guide.appendChild(heading);
            });
            grid.appendChild(guide);

            RESTORE_CATEGORIES.forEach(({ key, label }) => {
              const row = document.createElement("div");
              row.className = "restore-row";
              const name = document.createElement("div");
              name.className = `restore-label ${key}`;
              name.textContent = label;
              row.appendChild(name);
              for (const part of RESTORE_PARTS) {
                const input = createNumberInput({
                  id: `restore-${key}-r${r}-p${p}-i${part}`,
                  onInput: recalculateRestore,
                });
                input.setAttribute("aria-label", `${r}게임 ${p}P ${label} 부분 점수 ${part}`);
                row.appendChild(input);
              }
              const subtotal = document.createElement("output");
              subtotal.id = `restore-${key}-subtotal-r${r}-p${p}`;
              subtotal.className = "restore-subtotal";
              subtotal.setAttribute("aria-label", `${r}게임 ${p}P ${label} 소계`);
              subtotal.htmlFor = RESTORE_PARTS
                .map((part) => `restore-${key}-r${r}-p${p}-i${part}`)
                .join(" ");
              subtotal.textContent = "0점";
              row.appendChild(subtotal);
              grid.appendChild(row);
            });
            card.appendChild(grid);
            playerGrid.appendChild(card);
          }
          roundPanel.appendChild(playerGrid);
          container.appendChild(roundPanel);
        }
        applyValues(prevValues);
        recalculateGame("restore");
      }

      const GAME_RUNTIME = {
        restore: {
          build: buildRestoreUI,
          recalc: recalculateRestore,
          tabEl: document.getElementById("tabRestore"),
          resetSelector: 'input[type="number"]',
        },
        castle: {
          build: buildUI,
          recalc: recalculate,
          tabEl: tabCastleEl,
          resetSelector: 'input[type="number"]',
        },
        lostcity: {
          build: buildLostUI,
          recalc: recalculateLost,
          tabEl: tabLostCityEl,
          resetSelector:
            'input[type="number"], input[type="hidden"], input[type="checkbox"]',
          resetExtra: syncAllLostWagerButtons,
          afterRestore: syncAllLostWagerButtons,
        },
        harmonies: {
          build: buildHarmoniesUI,
          recalc: recalculateHarmonies,
          tabEl: tabHarmoniesEl,
          resetSelector: 'input[type="number"]',
        },
        century: {
          build: buildCenturyUI,
          recalc: recalculateCentury,
          tabEl: tabCenturyEl,
          resetSelector: 'input[type="number"]',
        },
        renaissance: {
          build: buildRenaissanceUI,
          recalc: recalculateRenaissance,
          tabEl: tabRenaissanceEl,
          resetSelector: 'input[type="number"], input[type="checkbox"]',
        },
        parks: {
          build: buildParksUI,
          recalc: recalculateParks,
          tabEl: tabParksEl,
          resetSelector: 'input[type="number"], input[type="checkbox"]',
        },
      };

      function buildGameUI(gameKey) {
        GAME_RUNTIME[gameKey].build();
      }

      function recalculateGame(gameKey) {
        GAME_RUNTIME[gameKey].recalc();
      }

      function resetGame(gameKey) {
        const game = GAME_DEFS[gameKey];
        const runtime = GAME_RUNTIME[gameKey];
        game.roundContainerEl
          .querySelectorAll(runtime.resetSelector || 'input[type="number"]')
          .forEach((el) => {
            if (el.type === "checkbox") {
              el.checked = false;
            } else {
              el.value = "0";
            }
          });
        runtime.resetExtra?.();
        recalculateGame(gameKey);
      }

      function bindGameControls(gameKey, resetButtonEl) {
        const game = GAME_DEFS[gameKey];
        game.playerCountEl.addEventListener("change", () => {
          state[game.statePlayersKey] =
            game.fixedPlayers || Number(game.playerCountEl.value) || 2;
          buildGameUI(gameKey);
        });
        game.roundCountEl.addEventListener("change", () => {
          setGameRounds(gameKey, game.roundCountEl.value);
        });
        resetButtonEl.addEventListener("click", () => {
          resetGame(gameKey);
        });
        game.addRoundBtnEl?.addEventListener("click", () => {
          setGameRounds(gameKey, Number(state[game.stateRoundsKey]) + 1);
        });
        updateRoundAddButton(gameKey);
      }

      bindGameControls("castle", resetBtn);
      bindGameControls("lostcity", lostResetBtnEl);
      bindGameControls("harmonies", harmResetBtnEl);
      bindGameControls("century", centResetBtnEl);
      bindGameControls("renaissance", renaResetBtnEl);
      bindGameControls("parks", parksResetBtnEl);
      bindGameControls("restore", document.getElementById("restoreResetBtn"));

      function setActiveGame(gameKey) {
        Object.entries(GAME_RUNTIME).forEach(([key, runtime]) => {
          const isActive = key === gameKey;
          runtime.tabEl.classList.toggle("active", isActive);
          GAME_DEFS[key].pageEl.classList.toggle("active", isActive);
          document.body.classList.toggle(
            `theme-${key === "lostcity" ? "lost" : key}`,
            isActive,
          );
        });
        saveStorageByKey(STORAGE_KEYS.ui, { activeGame: gameKey });
        GAME_RUNTIME[gameKey].tabEl.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "center",
        });
      }

      Object.entries(GAME_RUNTIME).forEach(([key, runtime]) => {
        runtime.tabEl.addEventListener("click", () => {
          setActiveGame(key);
        });
      });

      window.addEventListener("resize", () => {
        Object.values(GAME_RUNTIME).forEach((runtime) => {
          runtime.afterRestore?.();
        });
      });

      const initialGame =
        storedUI?.activeGame === "lostcity" ||
        storedUI?.activeGame === "harmonies" ||
        storedUI?.activeGame === "century" ||
        storedUI?.activeGame === "renaissance" ||
        storedUI?.activeGame === "parks" ||
        storedUI?.activeGame === "restore"
          ? storedUI.activeGame
          : "castle";
      setActiveGame(initialGame);
      Object.keys(GAME_RUNTIME).forEach((gameKey) => buildGameUI(gameKey));
      Object.keys(GAME_RUNTIME).forEach((gameKey) => updateRoundAddButton(gameKey));

      const hasStoredValues = Object.values(storedByGame).some((v) =>
        Boolean(v),
      );
      if (hasStoredValues) {
        Object.entries(storedByGame).forEach(([gameKey, stored]) => {
          applyValues(stored?.values);
          GAME_RUNTIME[gameKey].afterRestore?.();
          recalculateGame(gameKey);
        });
      }
    </script>
  </body>
</html>
